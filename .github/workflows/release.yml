name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: 发布 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          # 麒麟桌面多基于较旧 Ubuntu/Debian；22.04 比 24.04 更易兼容
          - os: ubuntu-22.04
            label: linux-kylin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Rundi ${{ github.ref_name }}
          releaseBody: |
            ## 润滴 ${{ github.ref_name }}

            ### Windows
            安装 `Rundi_*_x64-setup.exe` 或 `.msi`。

            ### Linux / 国产麒麟（x86_64）
            在 Ubuntu 22.04 兼容环境打包，适用于银河麒麟等 Debian/Ubuntu 系桌面：
            - 优先安装 `.deb`
            - 若依赖不匹配可试 AppImage（需可执行权限：`chmod +x *.AppImage`）

            运行时需有 `webkit2gtk-4.1`、托盘相关库（如 `libayatana-appindicator3`）。

            已安装客户端启动后会检查更新；也可在设置里点「检查更新」。
          releaseDraft: false
          prerelease: false
