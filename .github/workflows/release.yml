name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: 发布 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          # 麒麟桌面多基于较旧 Ubuntu/Debian；22.04 比 24.04 更易兼容
          - os: ubuntu-22.04
            label: linux-kylin
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与配置版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if [[ "$tag" != "$conf" || "$tag" != "$pkg" || "$tag" != "$cargo" ]]; then
            echo "::error::发版 tag 与版本号不一致。先同步提高 package.json / tauri.conf.json / Cargo.toml，再打 tag。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 组装 Release 说明
        id: notes
        shell: bash
        run: |
          {
            echo "## 润滴 ${GITHUB_REF_NAME}"
            echo ""
            cat RELEASE_NOTES.md
            echo ""
            echo "---"
            echo ""
            cat .github/release-install.md
          } > /tmp/release-body.md
          {
            echo "body<<EOF"
            cat /tmp/release-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Rundi ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
