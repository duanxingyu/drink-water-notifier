[package]
name = "rundi-core"
version = "0.1.0"
edition = "2021"
description = "润滴的日程、配置与计数逻辑"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
