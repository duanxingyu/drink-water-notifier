[package]
name = "rundi"
version = "0.1.0"
description = "工作日喝水提醒"
authors = ["Rundi"]
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "rundi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rundi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rundi-core = { path = "../crates/rundi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
